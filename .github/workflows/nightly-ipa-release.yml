name: Nightly IPA Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zipbridge-nightly-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build unsigned IPA and publish release
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ZipBridge.xcodeproj \
            -scheme ZipBridge

      - name: Build unsigned app for physical iOS devices
        run: |
          BUILD_NUMBER="$(date -u +%Y%m%d%H%M)"
          RELEASE_DATE="$(date -u +%Y%m%d)"
          RELEASE_TAG="nightly-$RELEASE_DATE"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

          xcodebuild \
            -project ZipBridge.xcodeproj \
            -scheme ZipBridge \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION=1.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphoneos/ZipBridge.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" release
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/ZipBridge.app"

          if [ -e "$RUNNER_TEMP/ipa/Payload/ZipBridge.app/embedded.mobileprovision" ]; then
            echo "::error::Unexpected provisioning profile found in unsigned app."
            exit 1
          fi

          IPA_NAME="ZipBridge-unsigned-${BUILD_NUMBER}.ipa"
          (
            cd "$RUNNER_TEMP/ipa"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/release/$IPA_NAME" Payload
          )
          test -s "release/$IPA_NAME"

          # Keep a stable asset name so clients do not need a timestamped URL.
          cp "release/$IPA_NAME" "release/ZipBridge.ipa"
          shasum -a 256 release/ZipBridge.ipa "release/$IPA_NAME" | tee release/SHA256SUMS.txt
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Detect or create today's latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Found existing release: $RELEASE_TAG"
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ZipBridge Build $RELEASE_TAG" \
              --notes "Manually triggered unsigned iOS build of ZipBridge from main.

          Latest build: $BUILD_NUMBER
          Signing: None (unsigned IPA)
          Minimum iOS: 16.0

          This IPA must be signed before it can be installed on a standard iPhone."
          else
            echo "No release found for $RELEASE_TAG; creating it."
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ZipBridge Build $RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --notes "Manually triggered unsigned iOS build of ZipBridge from main.

          Build: $BUILD_NUMBER
          Signing: None (unsigned IPA)
          Minimum iOS: 16.0

          This IPA must be signed before it can be installed on a standard iPhone."
          fi

          RELEASE_ID="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq '.databaseId')"
          # Promote this release so GitHub's /releases/latest/download URL resolves.
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F prerelease=false \
            -F make_latest=true

      - name: Remove every existing release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Start with a clean release so stale timestamped IPAs cannot accumulate.
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' > "$RUNNER_TEMP/old-release-assets.txt"

          while IFS= read -r asset_name; do
            [ -n "$asset_name" ] || continue
            echo "Deleting old release asset: $asset_name"
            gh release delete-asset "$RELEASE_TAG" "$asset_name" \
              --repo "$GITHUB_REPOSITORY" \
              --yes
          done < "$RUNNER_TEMP/old-release-assets.txt"

      - name: Upload IPA and checksum to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "release/$IPA_NAME" \
            release/ZipBridge.ipa \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify release contains stable and versioned IPA assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' | tee "$RUNNER_TEMP/release-assets.txt"
          grep -Fx "$IPA_NAME" "$RUNNER_TEMP/release-assets.txt"
          grep -Fx "ZipBridge.ipa" "$RUNNER_TEMP/release-assets.txt"
          grep -Fx "SHA256SUMS.txt" "$RUNNER_TEMP/release-assets.txt"
