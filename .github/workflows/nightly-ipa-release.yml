name: Nightly IPA Release

on:
  schedule:
    # GitHub Actions cron uses UTC: 03:00 every night.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zipbridge-nightly-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build signed IPA and publish nightly release
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Validate required signing secrets
        env:
          CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_AD_HOC_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          missing=0
          for item in CERTIFICATE CERTIFICATE_PASSWORD PROFILE TEAM_ID; do
            if [ -z "${!item}" ]; then
              echo "::error::Missing required secret: $item"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure the four signing secrets listed in README.md before running this workflow."
            exit 1
          fi

      - name: Install Ad Hoc provisioning profile
        env:
          PROFILE: ${{ secrets.IOS_AD_HOC_PROFILE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/signing/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/signing/profile.mobileprovision" > "$RUNNER_TEMP/signing/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/signing/profile.plist")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/signing/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/signing/profile.plist")
          PROFILE_EXPIRY=$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$RUNNER_TEMP/signing/profile.plist")
          PROFILE_DEVICE_COUNT=$(/usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/signing/profile.plist" 2>/dev/null | grep -c '^[[:space:]]*[^({]' || true)
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_APP_ID=$PROFILE_APP_ID" >> "$GITHUB_ENV"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/signing/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "Using profile: $PROFILE_NAME ($PROFILE_UUID)"

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}

      - name: Validate profile app identifier and Ad Hoc type
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          EXPECTED_APP_ID="$TEAM_ID.com.mr3242.ZipBridge"
          if [ "$PROFILE_APP_ID" != "$EXPECTED_APP_ID" ]; then
            echo "::error::Profile application identifier must be $EXPECTED_APP_ID, got $PROFILE_APP_ID."
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/signing/profile.plist" >/dev/null || {
            echo "::error::The profile must be an Ad Hoc profile with registered device UDIDs."
            exit 1
          }
          echo "Profile matches $EXPECTED_APP_ID and includes Ad Hoc devices."

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ZipBridge.xcodeproj \
            -scheme ZipBridge

      - name: Archive for physical iOS devices
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          BUILD_NUMBER="$(date -u +%Y%m%d%H%M)"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          xcodebuild \
            -project ZipBridge.xcodeproj \
            -scheme ZipBridge \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ZipBridge.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION=1.0 \
            archive

      - name: Create IPA export options
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.mr3242.ZipBridge</key><string>$PROFILE_NAME</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          PLIST

      - name: Export and validate IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ZipBridge.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          test -s "$RUNNER_TEMP/ipa/ZipBridge.ipa"
          mkdir -p release
          cp "$RUNNER_TEMP/ipa/ZipBridge.ipa" "release/ZipBridge-${BUILD_NUMBER}.ipa"
          shasum -a 256 "release/ZipBridge-${BUILD_NUMBER}.ipa" | tee release/SHA256SUMS.txt

      - name: Publish GitHub nightly prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ env.BUILD_NUMBER }}
          name: ZipBridge Nightly ${{ env.BUILD_NUMBER }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            release/ZipBridge-${{ env.BUILD_NUMBER }}.ipa
            release/SHA256SUMS.txt
          body: |
            Automated nightly iOS build of ZipBridge from `main`.

            - Build: ${{ env.BUILD_NUMBER }}
            - Signing: Ad Hoc
            - Minimum iOS: 16.0

            The Ad Hoc profile must include the installing device's UDID.
