name: iOS Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ZipBridge for iOS Simulator
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ZipBridge.xcodeproj -scheme ZipBridge
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project ZipBridge.xcodeproj \
            -scheme ZipBridge \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
